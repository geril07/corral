                      "width",
                      [
                        ["Comfortable", "Comfortable"],
                        ["Wide", "Wide"],
                      ],
                      state.width,
                    ),
                  ),
              ) +
              settingSection(
                "Input",
                settingRow(
                  "Send shortcut",
                  "Still an open decision. This study sends with the button only.",
                  "Not decided",
                ),
              );
          if (state.settingsPage === "Tasks & checkouts")
            content =
              '<p class="settings-intro">Illustrative configuration values. Repository and checkout are selected when creating a task, not while chatting.</p>' +
              settingSection(
                "New tasks",
                settingRow(
                  "Default agent view",
                  "The terminal is another interface to the same agent session.",
                  "Chat<small>Example global default</small>",
                ) +
                  settingRow(
                    "Checkout",
                    "Use the repository directly unless another checkout is chosen.",
                    "Current checkout<small>Example global default</small>",
                  ),
              ) +
              settingSection(
                "Worktrees",
                settingRow(
                  "Worktree root",
                  "New working copies live outside the source repository.",
                  "~/.local/share/corral/worktrees<small>Example configuration</small>",
                ),
              );
          if (state.settingsPage === "Agents & profiles")
            content =
              '<p class="settings-intro">Actual models, thinking levels, and availability must come from the agent. This study does not scan your installation.</p>' +
              settingSection(
                "Agents",
                Object.entries(agentNames)
                  .map(([id, name]) =>
                    settingRow(
                      `<span style="display:flex;align-items:center;gap:8px">${brand(id)}${name}</span>`,
                      "Model and thinking options vary by tool and driver.",
                      "Example entry",
                    ),
                  )
                  .join(""),
              ) +
              settingSection(
                "Launch profiles",
                settingRow(
                  "Named profiles",
                  "Provider/environment choices remain in the configuration file.",
                  "File-based",
                ),
              );
          if (state.settingsPage === "Keybindings")
            content =
              '<p class="settings-intro">Grouped by purpose. Actual bindings are still read from your configuration.</p>' +
              settingSection(
                "Tasks",
                settingRow("New task", "", "<kbd>alt+a</kbd> <kbd>t</kbd>") +
                  settingRow("Find task", "", "<kbd>alt+a</kbd> <kbd>f</kbd>") +
                  settingRow("Settle task", "", "<kbd>alt+a</kbd> <kbd>d</kbd>"),
              ) +
              settingSection(
                "Sessions",
                settingRow("New shell", "", "<kbd>alt+a</kbd> <kbd>c</kbd>") +
                  settingRow("New agent", "", "<kbd>alt+a</kbd> <kbd>s</kbd>") +
                  settingRow("Switch chat / terminal", "", "<kbd>alt+a</kbd> <kbd>v</kbd>"),
              );
          if (state.settingsPage === "Configuration")
            content =
              '<p class="settings-intro">Configuration remains file-based. This study neither reads nor writes config.toml.</p>' +
              settingSection(
                "Configuration file",
                settingRow(
                  "Path",
                  "On the machine running the server.",
                  "~/.config/corral/config.toml<small>Example path</small>",
                ) +
                  settingRow(
                    "Value resolution",
                    "Project overrides global; global overrides built-in defaults.",
                    "Built-in → Global → Project",
                  ),
              ) +
              settingSection(
                "Diagnostics",
                settingRow(
                  "Configuration problems",
                  "The real view would show invalid entries here.",
                  "No live scan",
                ),
              );
          document.getElementById("settings-root").innerHTML =
            `<nav class="settings-nav" aria-label="Settings categories"><h2>Settings</h2>${settingsPages.map(([name, icon]) => `<button class="${state.settingsPage === name ? "active" : ""}" data-action="settings-page" data-value="${name}" ${state.settingsPage === name ? 'aria-current="page"' : ""}>${glyph(icon)}<span>${name}</span></button>`).join("")}<p class="note">Your task and draft stay underneath.</p></nav><section class="settings-main"><header class="settings-header"><span>Settings /</span><span>${state.settingsPage}</span>${iconButton("close-settings", "Close settings", "x")}</header><div class="settings-content">${content}</div></section>`;
        }
        function openSettings(opener) {
          capture();
          closePopup(false);
          settingsOpener = opener;
          renderSettings();
          settingsDialog.showModal();
        }
        function openEdit(kind, target, opener) {
          closePopup(false);
          editTarget = { kind, target, opener };
          const item =
            kind === "rename-session"
              ? task().sessions.find((entry) => entry.id === target)
              : tasks.find((entry) => entry.id === target);
          const destructive = kind === "remove" || kind === "close-session";
          editDialog.innerHTML = `<h2>${destructive ? (kind === "remove" ? "Remove preview task?" : "Close preview session?") : kind === "rename-session" ? "Rename session" : "Rename task"}</h2>${destructive ? "<p>This changes in-memory sample data only. No real process or working copy is affected.</p>" : `<input aria-label="Name" value="${escape(item?.label || item?.title || "")}" autofocus>`}<div class="dialog-actions"><button data-action="cancel-edit">Cancel</button><button class="${destructive ? "danger" : "primary"}" data-action="confirm-edit">${destructive ? "Remove" : "Save"}</button></div>`;
          editDialog.showModal();
          if (destructive) editDialog.querySelector("button")?.focus();
        }
        function submit() {
          capture();
          const text = state.current === "new" ? draft.prompt : session()?.draft;
          if (!text?.trim()) {
            app.querySelector(".prompt")?.focus();
            return;
          }
          if (state.current === "new") {
            const agent = { ...draft.sessions[0], context: 0, draft: "" };
            const item = {
              id: "preview-" + ++serial,
              title: draft.title.trim() || text.trim().slice(0, 48),
              project: draft.project,
              status: "done",
              time: "Now",
              state: "active",
              prompt: text.trim(),
              sessions: [agent],
              messages: [],
            };
            tasks.unshift(item);
            state.current = item.id;
            draft.prompt = "";
            draft.title = "";
          } else {
            task().messages.push({ role: "user", text: text.trim(), session: session().id });
            session().draft = "";
          }
          task().messages.push({
            role: "assistant",
            text: "Preview response only. Nothing was sent to an agent and no files were changed.",
            session: session().id,
          });
          render();
          const log = app.querySelector(".transcript");
          if (log) log.scrollTop = log.scrollHeight;
          app.querySelector(".prompt")?.focus();
        }
        function dispatch(action, value, button) {
          capture();
          if (action === "sidebar") {
            state.sidebarOpen = !state.sidebarOpen;
            render();
            return;
          }
          if (action === "context") {
            state.contextOpen = !state.contextOpen;
            render();
            return;
          }
          if (action === "new-task") {
            if (state.current !== "new") {
              state.previous = state.current;
              draft.project = task().project;
            }
            state.current = "new";
            render();
            app.querySelector(".prompt")?.focus();
            return;
          }
          if (action === "task") {
            state.current = value;
            render();
            return;
          }
          if (action === "session") {
            state.selected[state.current] = value;
            render();
            return;
          }
          if (action === "view") {
            session().view = value;
            render();
            return;
          }
          if (action === "settings") {
            openSettings(button);
            return;
          }
          if (action === "close-settings") {
            settingsDialog.close();
            return;
          }
          if (action === "settings-page") {
            state.settingsPage = value;
            renderSettings();
            showState();
            return;
          }
          if (action === "tab-position") {
            state.tabPosition = value;
            render();
            renderSettings();
            return;
          }
          if (action === "width") {
            state.width = value;
            render();
            renderSettings();
            return;
          }
          if (action === "zoom") {
            state.zoom = Math.min(140, Math.max(80, state.zoom + Number(value)));
            render();
            renderSettings();
            return;
          }
          if (action === "grouping") {
            state.grouping = value;
            state.collapsedGroups = [];
            render();
            return;
          }
          if (action === "group") {
            state.collapsedGroups.includes(value)
              ? (state.collapsedGroups = state.collapsedGroups.filter((item) => item !== value))
              : state.collapsedGroups.push(value);
            render();
            return;
          }
          if (action === "settled") {
            state.settledOpen = !state.settledOpen;
            render();
            return;
          }
          if (action === "more-settled") {
            state.settledCount += 4;
            const scroll = app.querySelector(".settled-scroll"),
              top = scroll?.scrollTop || 0;
            render();
            app.querySelector(".settled-scroll")?.scrollTo(0, top);
            return;
          }
          if (action === "new-shell") {
            const item = {
              id: "shell-" + ++serial,
              kind: "shell",
              label:
                "shell" +
                (task().sessions.filter((entry) => entry.kind === "shell").length
                  ? " " + (task().sessions.filter((entry) => entry.kind === "shell").length + 1)
                  : ""),
            };
            task().sessions.push(item);
            state.selected[state.current] = item.id;
            render();
            return;
          }
          if (action === "new-agent") {
            openPopup(
              "model",
              app.querySelector('[data-action="add-session"]') || button,
              null,
              "new-agent",
            );
            return;
          }
          if (action === "pick-group") {
            pickerGroup = value;
            popupQuery = "";
            updatePicker(`[data-action="pick-group"][data-value="${value}"]`);
            return;
          }
          if (action === "pick-model") {
            const [instanceId, modelId] = value.split("|"),
              instance = instances.find((item) => item.id === instanceId);
            pending.instance = instanceId;
            pending.tool = instance.tool;
            pending.model = modelId;
            const selected = catalogs[pending.tool].find((item) => item.id === modelId);
            if (!selected.levels.includes(pending.thinking))
              pending.thinking = selected.defaultThinking || selected.levels[0];
            previewModel();
            updatePicker(`[data-action="pick-model"][data-value="${value}"]`);
            return;
          }
          if (action === "pick-thinking") {
            pending.thinking = value;
            commitPicker();
            return;
          }
          if (action === "title") {
            draft.showTitle = !draft.showTitle;
            render();
            app.querySelector("#task-title")?.focus();
            return;
          }
          if (action === "pick-project") {
            draft.project = value;
            draft.workspace = "Current checkout";
            draft.branch = "main";
            render();
            return;
          }
          if (action === "pick-workspace") {
            draft.workspace = value;
            draft.branch = "main";
            render();
            return;
          }
          if (action === "pick-branch") {
            draft.workspace = "New worktree";
            draft.branch = value;
            render();
            return;
          }
          if (action === "tools") {
            const detail = button.parentElement.querySelector("pre");
            detail.hidden = !detail.hidden;
            button.setAttribute("aria-expanded", !detail.hidden);
            return;
          }
          if (action === "rename" || action === "remove") {
            openEdit(action, popupTarget || state.current, popupOpener || button);
            return;
          }
          if (action === "rename-session" || action === "close-session") {
            openEdit(action, popupTarget || session()?.id, popupOpener || button);
            return;
          }
          if (action === "cancel-edit") {
            editDialog.close();
            return;
          }
          if (action === "confirm-edit") {
            const { kind, target } = editTarget;
            if (kind === "rename")
              tasks.find((item) => item.id === target).title =
                editDialog.querySelector("input").value.trim() || "Untitled task";
            if (kind === "rename-session")
              task().sessions.find((item) => item.id === target).label =
                editDialog.querySelector("input").value.trim() || "Session";
            if (kind === "remove") {
              const index = tasks.findIndex((item) => item.id === target);
              tasks.splice(index, 1);
              if (state.current === target)
                state.current = tasks.find((item) => item.state === "active")?.id || "new";
            }
            if (kind === "close-session")
              task().sessions = task().sessions.filter((item) => item.id !== target);
            editDialog.close();
            render();
            return;
          }
          if (action === "settle") {
            const item = tasks.find((entry) => entry.id === (popupTarget || state.current));
            item.state = item.state === "active" ? "settled" : "active";
            render();
            return;
          }
          if (action === "copy-path") {
            closePopup();
            toast("Copy checkout path is explicit. The repository label itself is not a button.");
            return;
          }
          if (action === "stop-session") {
            closePopup();
            toast("No agent is running in this study.");
            return;
          }
          if (
            [
              "model",
              "task-menu",
              "session-menu",
              "group-menu",
              "add-session",
              "project",
              "workspace",
              "add-project",
            ].includes(action)
          )
            openPopup(action, button);
        }
        document.addEventListener("click", (event) => {
          const button = event.target.closest("[data-action]");
          if (button) {
            event.preventDefault();
            dispatch(button.dataset.action, button.dataset.value, button);
            return;
          }
          if (popup && !popup.contains(event.target)) closePopup(false);
          if (!event.target.closest(".toast")) app.querySelector(".toast")?.remove();
        });
        app.addEventListener("submit", (event) => {
          event.preventDefault();
          submit();
        });
        app.addEventListener("input", (event) => {
          if (event.target.matches(".prompt")) {
            capture();
            fitPrompt();
            showState();
          }
          if (event.target.id === "task-title") {
            draft.title = event.target.value;
            showState();
          }
          if (event.target.matches('[aria-label="Search tasks"]')) {
            state.search = event.target.value;
            app.querySelector("#task-list").innerHTML = taskList();
            showState();
          }
          if (event.target.matches('[aria-label="Search models"]')) {
            popupQuery = event.target.value;
            popup
              .querySelectorAll("[data-filter]")
              .forEach(
                (row) =>
                  (row.hidden = !row.dataset.filter
                    .toLowerCase()
                    .includes(popupQuery.toLowerCase())),
              );
          }
          if (event.target.closest(".popup-search")) {
            const query = event.target.value.toLowerCase();
            popup
              ?.querySelectorAll("[data-filter]")
              .forEach((row) => (row.hidden = !row.dataset.filter.toLowerCase().includes(query)));
          }
        });
        app.addEventListener("contextmenu", (event) => {
          const row = event.target.closest("[data-task],[data-session]");
          if (!row) return;
          event.preventDefault();
          openPopup(
            row.dataset.task ? "task-menu" : "session-menu",
            row,
            { x: event.clientX, y: event.clientY },
            row.dataset.task || row.dataset.session,
          );
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && popup) {
            event.preventDefault();
            event.stopPropagation();
            closePopup();
            return;
          }
          if (settingsDialog.open || editDialog.open) return;
          if (event.key === "Enter" && event.target.id === "task-title") {
            event.preventDefault();
            app.querySelector(".prompt")?.focus();
            return;
          }
          const row = event.target.closest("[data-task],[data-session]");
          if (row && (event.key === "ContextMenu" || (event.shiftKey && event.key === "F10"))) {
            event.preventDefault();
            openPopup(
              row.dataset.task ? "task-menu" : "session-menu",
              row,
              null,
              row.dataset.task || row.dataset.session,
            );
            return;
          }
          if (
            popup?.dataset.popup === "model" &&
            (event.ctrlKey || event.metaKey) &&
            /^[1-9]$/.test(event.key)
          ) {
            event.preventDefault();
            const row = popup.querySelectorAll(".model-option")[Number(event.key) - 1];
            if (row && !row.hidden) row.click();
            return;
          }
          if (popup && ["ArrowDown", "ArrowUp"].includes(event.key)) {
            const buttons = [...popup.querySelectorAll("button:not([hidden])")];
            const i = buttons.indexOf(document.activeElement);
            event.preventDefault();
            buttons[
              (i + (event.key === "ArrowDown" ? 1 : buttons.length - 1)) % buttons.length
            ]?.focus();
            return;
          }
          if (popup && event.key === "Enter" && event.target.matches("input")) {
            event.preventDefault();
            popup.querySelector("[data-filter]:not([hidden])")?.click();
            return;
          }
          if (row?.dataset.session && ["ArrowLeft", "ArrowRight"].includes(event.key)) {
            event.preventDefault();
            capture();
            const sessions = task().sessions,
              i = sessions.findIndex((item) => item.id === row.dataset.session);
            state.selected[state.current] =
              sessions[
                (i + (event.key === "ArrowRight" ? 1 : sessions.length - 1)) % sessions.length
              ].id;
            render();
            app.querySelector('[role="tab"][aria-selected="true"]')?.focus();
            return;
          }
          if (event.key === "Escape" && state.current === "new") {
            event.preventDefault();
            capture();
            state.current = state.previous;
            render();
          }
        });
        settingsDialog.addEventListener("close", () => {
          const opener = settingsOpener?.isConnected
            ? settingsOpener
            : app.querySelector('[data-action="settings"]') || app.querySelector(".prompt");
          opener?.focus({ preventScroll: true });
        });
        editDialog.addEventListener("close", () => {
          const opener = editTarget?.opener;
          if (opener?.isConnected) opener.focus({ preventScroll: true });
          else app.querySelector(".prompt")?.focus();
        });
        for (const dialog of [settingsDialog, editDialog])
          dialog.addEventListener("click", (event) => {
            if (event.target !== dialog) return;
            const box = dialog.getBoundingClientRect();
            if (
              event.clientX < box.left ||
              event.clientX > box.right ||
              event.clientY < box.top ||
              event.clientY > box.bottom
            )
              dialog.close();
          });
        function bindResize() {
          const handle = app.querySelector(".resize"),
            sidebar = app.querySelector(".sidebar");
          handle.addEventListener("pointerdown", (event) => {
            handle.setPointerCapture(event.pointerId);
            handle.classList.add("dragging");
            const move = (e) => {
              state.sidebarWidth = Math.max(
                158,
                Math.min(
                  app.clientWidth * 0.4,
                  (e.clientX - app.getBoundingClientRect().left) / (state.zoom / 100),
                ),
              );
              sidebar.style.flexBasis = state.sidebarWidth + "px";
            };
            handle.addEventListener("pointermove", move);
            handle.addEventListener(
              "pointerup",
              () => {
                handle.classList.remove("dragging");
                handle.removeEventListener("pointermove", move);
                showState();
              },
              { once: true },
            );
          });
          handle.addEventListener("keydown", (event) => {
            if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
            event.preventDefault();
            state.sidebarWidth = Math.max(
              158,
              Math.min(
                app.clientWidth * 0.4,
                sidebar.getBoundingClientRect().width / (state.zoom / 100) +
                  (event.key === "ArrowRight" ? 12 : -12),
              ),
            );
            sidebar.style.flexBasis = state.sidebarWidth + "px";
            showState();
          });
        }
        function truncationTarget(target) {
          const element =
            target.closest("[data-fullname]") ||
            [...(target.closest("button")?.querySelectorAll("[data-fullname]") || [])].find(
              (node) => node.scrollWidth > node.clientWidth,
            );
          return element;
        }
        function updateFullName(event) {
          const element = truncationTarget(event.target);
          if (element)
            element.title =
              element.scrollWidth > element.clientWidth ? element.dataset.fullname : "";
        }
        app.addEventListener("pointerover", updateFullName);
        app.addEventListener("focusin", updateFullName);
        window.addEventListener("resize", () => {
          sizeWorkspace();
          if (popup) positionPopup(popupOpener);
        });
        render();
        openPopup("model", app.querySelector('[data-action="model"]'));
      })();
    </script>
  </body>
</html>
