    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;

        --raised: #1c1c1c;
        --hover: #242424;
        --border: #ffffff15;

      }

      textarea {

      }

        justify-content: center;
        gap: 0.4rem;

      }

        height: 1rem;
        flex: none;

      input[type="search"],
      input[type="text"],
      select,
      textarea {
        min-width: 0;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 0.45rem;

      .view-select {
        max-width: 7.3rem;

        font-size: 0.72rem;
        color: var(--muted);

        .rulegrid {

        .rulebox-head {

        .modelrow {
          min-height: 3rem;

        .footer {
          padding: 0.45rem 0.6rem;

        .footer .status {
          max-width: 18rem;
        }
        .modal-top {
          padding: 0.45rem 0.7rem;
        }
      }
      @media (max-width: 760px) {
        .manager-top,
        .inline-shell .manager-top {
          display: flex;
        }
        .modal-top .stack {
          flex-direction: column;
          align-items: flex-start;
        }
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .modal {
          width: calc(100vw - 1rem);
        }
        .settings-body {
          grid-template-columns: 1fr;
        }
        .settings-nav {
          display: none;
        }
        .manager-body {
          grid-template-columns: 1fr;
        }
        .providers {
          max-height: 5rem;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          display: flex;
          overflow: auto;
        }
        .provider {
          flex: none;
          min-width: 9rem;
        }
        .manager-context {
          display: none;
        }
        .rulegrid {
          grid-template-columns: 1fr;
        }
        .inline-shell .manager-body {
          grid-template-columns: 1fr;
        }
        .picker-body {
          grid-template-columns: 2.7rem minmax(0, 1fr) 7rem;
        }
        .lab .secondary-lab {
          display: none;
        }
        .profile-select {
          min-width: 0;
          width: 100%;
        }
        .study-label {
          max-width: 20rem;
        }
        .state-button {
          display: none;
        }
        .footer .status {
          max-width: 11rem;
        }
        .lab strong {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast"></div>
    <script>
      const names = {
        A: "Settings · провайдеры и модели",
        B: "Picker · управление на месте",
        C: "Settings · явные правила",
      };
      const variants = ["A", "B", "C"];
      const instanceList = [
        { id: "pi-personal", kind: "pi", name: "pi · Personal", badge: "PI" },
        { id: "pi-work", kind: "pi", name: "pi · Work", badge: "PW" },
        { id: "oc-personal", kind: "opencode", name: "OpenCode · Personal", badge: "OP" },
        {
          id: "oc-work",
          kind: "opencode",
          name: "OpenCode · Work / длинное название корпоративного gateway",
          badge: "OW",
        },
      ];
      const providers = [
        ["openai-codex", "OpenAI Codex"],
        ["anthropic", "Anthropic"],
        ["opencode-go", "OpenCode Go"],
        ["google", "Google"],
        ["openrouter", "OpenRouter"],
        ["groq", "Groq"],
        ["cerebras", "Cerebras"],
        ["ollama", "Ollama"],
      ];
      const seeds = {
        "openai-codex": [
          ["gpt-6.1-sol", "GPT-6.1 Sol"],
          ["gpt-6-astra", "GPT-6 Astra"],
          ["gpt-6-luna", "GPT-6 Luna"],
          ["gpt-5.4", "GPT-5.4"],
        ],
        anthropic: [
          ["claude-sonnet-5-5", "Claude Sonnet 5.5"],
          ["claude-opus-5-5", "Claude Opus 5.5"],
          ["claude-haiku-5-5", "Claude Haiku 5.5"],
        ],
        "opencode-go": [
          ["deepseek-v4.1-flash", "DeepSeek V4.1 Flash"],
          ["glm-5", "GLM 5"],
          ["qwen3-coder", "Qwen 3 Coder"],
        ],
        google: [
          ["gemini-3.8-flash", "Gemini 3.8 Flash"],
          ["gemini-3.1-pro", "Gemini 3.1 Pro"],
        ],
        openrouter: [
          ["anthropic/claude-sonnet-5-5", "Claude Sonnet / OpenRouter"],
          ["openai/gpt-6.1-sol", "GPT-6.1 Sol / OpenRouter"],
        ],
        groq: [["qwen3-32b", "Qwen 3 32B"]],
        cerebras: [["gpt-oss-120b", "GPT OSS 120B"]],
        ollama: [["qwen3-coder:30b", "Qwen 3 Coder Local"]],
      };
      let catalog = providers.flatMap(([provider]) =>
        [
          ...(seeds[provider] || []),
          ...Array.from({ length: 5 }, (_, i) => [
            `demo-family-${i + 1}`,
            `Demo family ${i + 1} · пример модели`,
          ]),
        ].map(([id, name]) => ({
          provider,
          id,
          name,
          levels:
            provider === "ollama"
              ? ["off"]
              : ["off", "low", "medium", "high", ...(id.includes("sol") ? ["xhigh"] : [])],
        })),
      );
      const key = (m) => JSON.stringify([m.provider, m.id]);
      const selector = (provider, model) => (model ? { provider, model } : { provider });
      const matches = (r, m) => r.provider === m.provider && (!r.model || r.model === m.id);
      const same = (a, b) => a.provider === b.provider && a.model === b.model;
      const searchMatch = (m, q) =>
        q
          .toLowerCase()
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .every((term) => [m.name, m.id, m.provider].join(" ").toLowerCase().includes(term));
      const initial = () => ({
        mode: "only",
        include: [
          selector("openai-codex"),
          selector("opencode-go", "deepseek-v4.1-flash"),
          selector("anthropic", "claude-sonnet-5-5"),
        ],
        exclude: [selector("openai-codex", "gpt-5.4")],
        favorites: [key(catalog[0]), key(catalog.find((m) => m.id === "deepseek-v4.1-flash"))],
      });
      const saved = Object.fromEntries(
        instanceList.map((p, i) => [
          p.id,
          i === 1
            ? {
                mode: "all",
                include: [],
                exclude: [selector("google"), selector("ollama")],
                favorites: [],
              }
            : initial(),
        ]),
      );
      const workingInstance = "pi-personal";
      let instance = "pi-personal",
        draft = structuredClone(saved[instance]),
        variant = new URLSearchParams(location.search).get("variant") || "A";
      if (!variants.includes(variant)) variant = "A";
      let provider = "openai-codex",
        search = "",
        view = "all",
        screen = "manager",
        pickerSearch = "",
        scenario = "ready",
        showState = false,
        saveFailed = false,
        dirtyHint = "",
        current = catalog[0],
        currentLevel = "high",
        pickerModel = current,
        preview = false,
        revision = 1;
      let returnPickerContext = { instance: workingInstance, search: "", model: current };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const ekey = (m) => encodeURIComponent(key(m));
      const decodeModel = (k) => catalog.find((m) => key(m) === decodeURIComponent(k));
      const profile = () => instanceList.find((p) => p.id === instance);
      const visible = (m, p = draft) =>
        !p.exclude.some((r) => matches(r, m)) &&
        (p.mode === "all" || p.include.some((r) => matches(r, m)));
      const dirty = () => JSON.stringify(draft) !== JSON.stringify(saved[instance]);
      const available = () =>
        scenario === "empty" || scenario === "error" || scenario === "loading"
          ? []
          : scenario === "partial"
            ? catalog.filter((m) => ["openai-codex", "anthropic"].includes(m.provider))
            : catalog;
      const activePolicy = () => (preview ? draft : saved[instance]);
      const sourceText = () =>
        scenario === "loading"
          ? "Получаем каталог агента…"
          : scenario === "refreshing"
            ? "Обновляем · используем предыдущий каталог"
            : scenario === "stale"
              ? "Устаревшие данные · обновление не удалось"
              : scenario === "error"
                ? "Каталог не получен"
                : scenario === "empty"
                  ? "Агент вернул пустой каталог"
                  : scenario === "partial"
                    ? "Неполный каталог · агент ещё загружает провайдеры"
                    : "Каталог получен · демонстрационные данные";
      function logo(kind) {
        return kind === "pi"
          ? '<svg class="logo" viewBox="165.29 165.29 469.43 469.43" aria-hidden="true"><path fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/><path d="M517.36 400H634.72V634.72H517.36Z"/></svg>'
          : '<svg class="logo" viewBox="0 0 32 40" aria-hidden="true"><path d="M24 32H8V16H24V32Z" opacity=".55"/><path d="M24 8H8V32H24V8ZM32 40H0V0H32V40Z"/></svg>';
      }
      function counts(p = draft, subset = available()) {
        return `${subset.filter((m) => visible(m, p)).length} / ${subset.length}`;
      }
      function why(m) {
        if (draft.exclude.some((r) => r.provider === m.provider && !r.model))
          return "Провайдер исключён";
        if (draft.exclude.some((r) => matches(r, m))) return "Исключена модель";
        if (draft.mode === "only" && !draft.include.some((r) => matches(r, m))) return "Не выбрана";
        return draft.include.some((r) => r.provider === m.provider && !r.model)
          ? "Весь провайдер"
          : "Показывается";
      }
      function addRule(type, rule) {
        if (!draft[type].some((r) => same(r, rule))) draft[type].push(rule);
        saveFailed = false;
        dirtyHint = "";
      }
      function removeRule(type, rule) {
        draft[type] = draft[type].filter((r) => !same(r, rule));
      }
      function providerAction(id) {
        const models = catalog.filter((m) => m.provider === id);
        const all = models.every((m) => visible(m));
        draft.exclude = draft.exclude.filter((r) => r.provider !== id);
        draft.include = draft.include.filter((r) => r.provider !== id);
        if (all) addRule("exclude", selector(id));
        else if (draft.mode === "only") addRule("include", selector(id));
        saveFailed = false;
      }
      function modelAction(m) {
        if (draft.exclude.some((r) => r.provider === m.provider && !r.model)) return;
        if (visible(m)) {
          addRule("exclude", selector(m.provider, m.id));
        } else {
          removeRule("exclude", selector(m.provider, m.id));
          if (draft.mode === "only") addRule("include", selector(m.provider, m.id));
        }
        saveFailed = false;
      }
      function modelRows(models) {
        return models
          .map((m) => {
            const on = visible(m),
              blocked = draft.exclude.some((r) => r.provider === m.provider && !r.model),
              favorite = draft.favorites.includes(key(m));
            return `<div class="modelrow ${on ? "" : "hidden"}"><input type="checkbox" data-act="model" data-model="${ekey(m)}" data-focus="check-${ekey(m)}" aria-label="Показывать ${esc(m.name)} · ${esc(m.provider)}" ${on ? "checked" : ""} ${blocked ? "disabled" : ""}><div class="stack"><span class="model-name clip" data-fullname="${esc(m.name)}">${esc(m.name)}</span><span class="model-info mono clip" data-fullname="${esc(m.provider + "/" + m.id)}">${esc(m.provider + "/" + m.id)}</span></div><span class="reason">${why(m)}</span><button class="star ${favorite ? "on" : ""}" data-act="favorite" data-model="${ekey(m)}" data-focus="star-${ekey(m)}" aria-label="${favorite ? "Убрать из избранного" : "В избранное"} ${esc(m.name)}" aria-pressed="${favorite}">${favorite ? "★" : "☆"}</button></div>`;
          })
          .join("");
      }
      function statusBlock() {
        if (scenario === "loading")
          return '<div class="empty"><strong>Получаем модели…</strong><span class="small">Список ещё не пустой — он ещё неизвестен.</span></div>';
        if (scenario === "error")
          return '<div class="empty"><strong>Не удалось получить каталог</strong><span class="small">Не подставляем список другого профиля.</span><button class="outline" data-act="refresh">Повторить</button></div>';
        if (scenario === "empty")
          return '<div class="empty"><strong>Агент не сообщил моделей</strong><span class="small">Это не результат фильтров Corral.</span><button class="outline" data-act="refresh">Обновить каталог</button></div>';
        return "";
      }
      function modelTable() {
        const models = available().filter(
          (m) =>
            (provider === "*" || m.provider === provider) &&
            searchMatch(m, search) &&
            (view === "all" || (view === "visible" ? visible(m) : !visible(m))),
        );
        return `<div class="models-pane"><div class="models-head"><strong class="grow clip">${provider === "*" ? "Все провайдеры" : esc(providers.find((p) => p[0] === provider)?.[1] || provider)}</strong><select class="view-select" data-change="view" data-focus="view" aria-label="Показывать строки"><option value="all" ${view === "all" ? "selected" : ""}>Все строки</option><option value="visible" ${view === "visible" ? "selected" : ""}>В picker</option><option value="hidden" ${view === "hidden" ? "selected" : ""}>Скрытые</option></select><span class="small">${models.length} строк</span></div>${statusBlock()}${!statusBlock() ? `<div class="models-list" data-scroll="models">${models.length ? modelRows(models) : `<div class="empty"><strong>Нет совпадений</strong><span class="small">Поиск и вид строк не меняют постоянные правила.</span><button data-act="clear-search" class="outline">Очистить поиск</button></div>`}</div>` : ""}</div>`;
      }
      function providerList() {
        return `<div class="providers" data-scroll="providers"><button class="${provider === "*" ? "active" : ""}" style="width:100%;justify-content:space-between" data-act="provider" data-provider="*">Все <span class="small">${counts()}</span></button>${providers
          .map(([id, name]) => {
            const models = available().filter((m) => m.provider === id),
              n = models.filter((m) => visible(m)).length;
            return `<div class="provider ${provider === id ? "chosen" : ""}"><input type="checkbox" data-act="provider-toggle" data-provider="${id}" data-focus="provider-check-${id}" aria-label="Все модели ${name}" ${n === models.length && n ? "checked" : ""} ${n > 0 && n < models.length ? 'data-mixed="true"' : ""} ${!models.length ? "disabled" : ""}><button data-act="provider" data-provider="${id}" data-focus="provider-${id}" aria-pressed="${provider === id}"><span class="clip">${name}</span><span class="provider-count">${n}/${models.length}</span></button></div>`;
          })
          .join(
            "",
          )}<p class="small" style="padding:.6rem .3rem">Галочка провайдера относится и к будущим моделям. Частичная галочка — есть отдельные правила.</p></div>`;
      }
      function commonTop() {
        return `<div class="manager-top"><div class="context-block"><select class="profile-select" data-change="instance" data-focus="instance" aria-label="Tool / profile">${instanceList.map((p) => `<option value="${p.id}" ${p.id === instance ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select><span class="small manager-context">Предложение: общие настройки клиентов этого сервера</span></div><div class="row spread" style="flex-wrap:wrap"><div class="mode-controls" role="group" aria-label="Режим видимости"><button data-act="mode" data-mode="all" aria-pressed="${draft.mode === "all"}" class="${draft.mode === "all" ? "active" : ""}">Всё, кроме…</button><button data-act="mode" data-mode="only" aria-pressed="${draft.mode === "only"}" class="${draft.mode === "only" ? "active" : ""}">Только выбранное</button></div><strong class="small">В picker: ${counts()}</strong></div><p class="small">${draft.mode === "only" ? "Новые модели видны только по разрешающим правилам. Выбран весь провайдер — видны и его новые модели." : "Новые модели видны, если не исключены. Скрытый провайдер остаётся скрытым при обновлении каталога."}</p><div class="row"><input type="search" placeholder="Найти модель, ID или провайдера" aria-label="Найти модели" data-input="search" data-focus="search" value="${esc(search)}"><button class="outline square" data-act="refresh" aria-label="Обновить каталог">↻</button></div></div>`;
      }
      function footer() {
        return `<div class="footer"><div class="row spread"><div class="stack grow"><span class="status ${saveFailed ? "warn" : ""}">${saveFailed ? "Не сохранено: сервер недоступен. Черновик остаётся здесь." : dirty() ? "Есть несохранённые изменения" : `Сохранённая видимость · ревизия ${revision}`}</span><span class="small">${sourceText()}</span></div><button class="outline" data-act="preview">Предпросмотр</button><button data-act="cancel">Отмена</button><button class="primary" data-act="save" ${dirty() ? "" : "disabled"}>${saveFailed ? "Повторить" : "Сохранить"}</button></div>${dirtyHint ? `<p class="small warn">${dirtyHint} <button data-act="discard-close">Закрыть без сохранения</button></p>` : ""}</div>`;
      }
      function rules() {
        const ruleList = (type) =>
          `<div class="rulebox"><div class="rulebox-head row spread"><strong>${type === "include" ? "Разрешено" : "Исключено"}</strong><span class="tag">${type === "include" ? "whitelist" : "blacklist"}</span></div>${draft[type].map((r, i) => `<div class="ruleline"><span class="tag">${r.model ? "модель" : "провайдер"}</span><span class="mono clip grow" data-fullname="${esc(r.provider + (r.model ? "/" + r.model : " / все будущие модели"))}">${esc(r.provider + (r.model ? "/" + r.model : " / *"))}</span><button class="square" data-act="remove-rule" data-type="${type}" data-index="${i}" aria-label="Удалить правило ${esc(r.provider)}">×</button></div>`).join("") || '<p class="small" style="padding:.75rem">Нет правил</p>'}<div class="rule-add"><select data-rule-select="${type}" aria-label="Добавить ${type === "include" ? "разрешающее" : "исключающее"} правило"><optgroup label="Провайдер целиком">${providers.map(([id, name]) => `<option value="${encodeURIComponent(JSON.stringify(selector(id)))}">${name} · все модели</option>`).join("")}</optgroup><optgroup label="Одна модель">${catalog.map((m) => `<option value="${encodeURIComponent(JSON.stringify(selector(m.provider, m.id)))}">${esc(m.provider + "/" + m.id)}</option>`).join("")}</optgroup></select><button class="outline" data-act="add-rule" data-type="${type}">＋ Добавить правило</button></div></div>`;
        return `<div class="rulearea" data-scroll="rules"><div class="notice">Исключение побеждает разрешение. Скрытый провайдер нельзя обойти галочкой одной модели; сначала снимите исключение провайдера.</div><div class="rulegrid">${ruleList("include")}${ruleList("exclude")}</div><div class="rule-preview"><div class="models-head"><strong>Результат правил</strong><span class="small">${counts()} моделей в picker</span><button class="outline" data-act="reset" style="margin-left:auto">Сбросить правила</button></div><div class="models-list">${modelRows(available().filter((m) => searchMatch(m, search)))}</div></div></div>`;
      }
      function VariantA() {
        return `<div class="shade"></div><section class="modal" role="dialog" aria-modal="true" aria-label="Модели · Settings"><div class="modal-top row spread"><div class="stack"><h2>Настройки</h2><span class="small">Модели · только видимость в Corral, не права доступа</span></div><button class="square" data-act="close" aria-label="Закрыть настройки">×</button></div><div class="settings-body">${settingsNav()}<section class="manager" aria-label="Видимость моделей">${commonTop()}<div class="manager-body">${providerList()}${modelTable()}</div>${footer()}</section></div></section>`;
      }
      function VariantB() {
        return `<section class="inline-shell" role="dialog" aria-modal="true" aria-label="Видимость · в picker"><div class="inline-head row spread"><button data-act="close">← К выбору модели</button><strong>Видимость моделей</strong><span class="tag">${counts()} · не выбор модели</span></div><section class="manager">${commonTop()}<div class="inline-models"><div class="inline-provider-bar"><select data-change="provider" data-focus="inline-provider" aria-label="Провайдер в inline picker"><option value="*" ${provider === "*" ? "selected" : ""}>Все провайдеры</option>${providers
          .map(
            ([id, name]) =>
              `<option value="${id}" ${provider === id ? "selected" : ""}>${name} · ${counts(
                draft,
                available().filter((m) => m.provider === id),
              )}</option>`,
          )
          .join(
            "",
          )}</select><button class="outline" data-act="provider-toggle" data-provider="${provider}" ${provider === "*" ? "disabled" : ""}>Показать / скрыть провайдера</button></div>${modelTable()}</div>${footer()}</section></section>`;
      }
      function VariantC() {
        return `<div class="shade"></div><section class="modal" role="dialog" aria-modal="true" aria-label="Модели · правила"><div class="modal-top row spread"><div class="stack"><h2>Настройки · Модели</h2><span class="small">Явные разрешающие и исключающие правила</span></div><button class="square" data-act="close" aria-label="Закрыть настройки">×</button></div><div class="settings-body">${settingsNav()}<section class="manager">${commonTop()}${rules()}${footer()}</section></div></section>`;
      }
      function settingsNav() {
        return `<nav class="settings-nav" aria-label="Категории настроек">${["Внешний вид", "Модели", "Клавиши", "Задачи", "Профили", "Агенты", "Конфигурация"].map((t) => `<button class="${t === "Модели" ? "active" : ""}" ${t === "Модели" ? 'aria-current="page"' : "disabled"}>${t}</button>`).join("")}<span class="small" style="margin-top:auto">Остальные категории — контекст прототипа.</span></nav>`;
      }
      function picker() {
        const p = activePolicy(),
          all = available(),
          models = all.filter((m) => visible(m, p) && searchMatch(m, pickerSearch)),
          hidden = instance === workingInstance && !visible(current, p);
        return `<section class="picker" role="dialog" aria-label="Выбор модели"><div class="picker-body"><div class="rail">${instanceList.map((i) => `<button data-act="pick-instance" data-instance="${i.id}" class="${i.id === instance ? "active" : ""}" aria-label="${esc(i.name)}" title="${esc(i.name)}">${logo(i.kind)}<span class="badge">${i.badge}</span></button>`).join("")}</div><div class="picker-models"><div class="picker-search stack"><div class="row spread"><strong class="small clip">${esc(profile().name)}</strong><button class="square" data-act="close-picker" aria-label="Закрыть picker">×</button></div><input type="search" placeholder="Найти модель" aria-label="Поиск в picker" data-input="picker-search" data-focus="picker-search" value="${esc(pickerSearch)}"></div>${hidden ? '<div class="info-line warn">Текущая модель скрыта фильтром. Сессия не изменена.</div>' : ""}${statusBlock()}<div class="picker-options">${models.map((m) => `<button class="pickrow ${key(m) === key(pickerModel) ? "selected" : ""}" data-act="choose-model" data-model="${ekey(m)}"><div class="stack grow"><span class="clip" data-fullname="${esc(m.name)}">${esc(m.name)}</span><span class="small clip">${esc(m.provider)}</span></div><span>${p.favorites.includes(key(m)) ? "★" : ""}</span><span>${key(m) === key(pickerModel) ? "✓" : ""}</span></button>`).join("") || (!statusBlock() ? `<div class="empty"><strong>${pickerSearch ? "Нет совпадений" : "Все модели скрыты"}</strong><span class="small">${pickerSearch ? "Сначала очистите поиск." : "Настройки не сбрасываем автоматически."}</span><button class="outline" data-act="${pickerSearch ? "clear-picker-search" : "manage"}">${pickerSearch ? "Очистить поиск" : "Изменить фильтры"}</button></div>` : "")}</div></div><aside class="thinking"><span class="small">Thinking · пример</span><strong class="clip" data-fullname="${esc(pickerModel.name)}">${esc(pickerModel.name)}</strong>${pickerModel.levels.map((l) => `<button data-act="choose-level" data-level="${l}" class="${l === currentLevel ? "active" : ""}">${l}</button>`).join("")}<p class="small">В production — только подтверждённые уровни этой модели.</p></aside></div><div class="picker-footer row spread"><span>${preview ? "Предпросмотр черновика · " : ""}Видно ${counts(p)}<span class="muted"> · ${p.mode === "only" ? "только выбранное" : "всё, кроме"}</span></span><button class="outline" data-act="manage">Управлять…</button></div></section>`;
      }
      function app() {
        const policy = saved[workingInstance],
          hidden = !visible(current, policy);
        return `<div class="app"><aside class="sidebar"><div class="row spread"><strong class="brand">corral</strong><span class="muted">▣</span></div><div class="row spread"><span>⌕ Поиск</span><span>＋</span></div><span class="small">⌄ corral</span><div class="side-task"><strong>Управление большим каталогом моделей</strong><div class="small">pi · main</div></div><div style="margin-top:auto" class="row"><button data-act="manage" aria-label="Открыть настройки">⚙</button><span class="small">workspace остаётся на месте</span></div></aside><main class="workspace"><header class="taskhead row"><span class="muted">corral</span><span class="muted">/</span><strong class="clip">Управление большим каталогом моделей</strong></header><nav class="tabs row" aria-label="Сессии"><button class="active">1 ${logo("pi")} pi</button><button>Changes</button><button>＋</button><span class="grow"></span><span class="small">Chat</span><span class="small">Terminal</span></nav><div class="workbody"><div class="lane"><div class="transcript"><div class="bubble">Оставь нужные модели, не меняя рабочую сессию.</div><p class="answer">Модель, черновик и контекст задачи сохраняются, пока настраиваем видимость.</p></div><div class="composer"><textarea data-input="prompt" data-focus="prompt" aria-label="Черновик сообщения">${esc(window.promptDraft || "Этот черновик не должен пропасть при открытии настроек моделей.")}</textarea><div class="composer-tools"><button class="current-trigger" data-act="open-picker">${logo(instanceList.find((p) => p.id === workingInstance).kind)}<span class="clip" data-fullname="${esc(current.name)}">${esc(current.name)}</span><span>⌄</span></button><span class="small">${currentLevel}</span>${hidden ? '<span class="tag warn">Скрыта фильтром</span>' : ""}<span class="grow"></span><button class="primary" data-act="send">Отправить</button></div></div></div></div></main></div>`;
      }
      function lab() {
        return `<div class="study-label">ПРОТОТИП · каталог и thinking примерные · без сохранения и вызовов агентов</div><div class="lab"><div class="row"><span class="lab-label">Вариант</span><button data-act="cycle" data-direction="-1" aria-label="Предыдущий вариант">←</button><strong>${variant} · ${names[variant]}</strong><button data-act="cycle" data-direction="1" aria-label="Следующий вариант">→</button><span class="grow"></span>${variants.map((v) => `<button data-act="variant" data-variant="${v}" class="${v === variant ? "active" : ""}">${v}</button>`).join("")}<button data-act="open-picker" class="outline">Picker</button><button data-act="manage" class="outline">Настройка</button></div><div class="row secondary-lab"><span class="lab-label">Состояние</span><select data-change="scenario" aria-label="Состояние каталога">${[
          ["ready", "Готов"],
          ["loading", "Первая загрузка"],
          ["partial", "Частичный каталог"],
          ["refreshing", "Обновление"],
          ["stale", "Ошибка + кэш"],
          ["error", "Ошибка без кэша"],
          ["empty", "Пусто"],
          ["save-error", "Ошибка сохранения"],
        ]
          .map(([v, t]) => `<option value="${v}" ${scenario === v ? "selected" : ""}>${t}</option>`)
          .join(
            "",
          )}</select><button data-act="add-model">＋ Новая модель</button><button data-act="hide-all">Скрыть всё</button><button data-act="reset">Сброс</button><button data-act="scale">${Math.round(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--scale")) * 100)}%</button><button data-act="state" aria-expanded="${showState}">Состояние { }</button></div></div>`;
      }
      function render() {
        const el = document.activeElement,
          focus = el?.dataset.focus,
          selection =
            el && ["text", "search"].includes(el.type)
              ? [el.selectionStart, el.selectionEnd]
              : null;
        const scrolls = Object.fromEntries(
          [...document.querySelectorAll("[data-scroll]")].map((n) => [
            n.dataset.scroll,
            n.scrollTop,
          ]),
        );
        document.getElementById("root").innerHTML =
          app() +
          (screen === "manager" ? { A: VariantA, B: VariantB, C: VariantC }[variant]() : "") +
          (screen === "picker" ? picker() : "") +
          lab() +
          (showState
            ? `<pre class="state" aria-label="Состояние прототипа">${esc(JSON.stringify({ prototype: true, variant, instance, scenario, source: "sample only", current: { provider: current.provider, id: current.id, level: currentLevel, hidden: !visible(current, saved[instance]) }, draft, saved: saved[instance], dirty: dirty(), inventory: catalog.length, visible: available().filter((m) => visible(m)).length, revision }, null, 2))}</pre>`
            : "");
        document.querySelectorAll("[data-mixed]").forEach((n) => (n.indeterminate = true));
        document
          .querySelectorAll("[data-scroll]")
          .forEach((n) => (n.scrollTop = scrolls[n.dataset.scroll] || 0));
        if (focus) {
          const n = [...document.querySelectorAll("[data-focus]")].find(
            (n) => n.dataset.focus === focus,
          );
          if (n) {
            n.focus({ preventScroll: true });
            if (selection) n.setSelectionRange(...selection);
          }
        }
      }
      function notice(text) {
        document.getElementById("toast").innerHTML =
          `<div class="toast" role="status">${esc(text)}</div>`;
        setTimeout(() => (document.getElementById("toast").innerHTML = ""), 3200);
      }
      function changeInstance(id) {
        if (dirty()) {
          notice("Сначала сохраните или отмените изменения текущего профиля.");
          render();
          return;
        }
        instance = id;
        draft = structuredClone(saved[id]);
        provider = "*";
        search = "";
        view = "all";
        saveFailed = false;
      }
      function openManager() {
        if (screen === "picker" && !preview)
          returnPickerContext = { instance, search: pickerSearch, model: pickerModel };
        else if (screen === "workspace")
          returnPickerContext = { instance: workingInstance, search: "", model: current };
        screen = "manager";
        preview = false;
      }
      function closeManager() {
        if (dirty()) {
          dirtyHint = "Есть черновик. Сохраните, отмените изменения или закройте без сохранения.";
          return;
        }
        screen = "picker";
        preview = false;
        instance = returnPickerContext.instance;
        pickerSearch = returnPickerContext.search;
        pickerModel = returnPickerContext.model;
        draft = structuredClone(saved[instance]);
      }
      function save() {
        if (scenario === "save-error") {
          saveFailed = true;
          return false;
        }
        saved[instance] = structuredClone(draft);
        revision++;
        saveFailed = false;
        dirtyHint = "";
        notice("Прототип: видимость применена только в памяти. Рабочая модель не изменена.");
        return true;
      }
      document.addEventListener("click", (event) => {
        const t = event.target.closest("[data-act]");
        if (!t || t.disabled) return;
        const a = t.dataset.act;
        if (a === "variant" || a === "cycle") {
          variant =
            a === "variant"
              ? t.dataset.variant
              : variants[(variants.indexOf(variant) + Number(t.dataset.direction) + 3) % 3];
          const url = new URL(location.href);
          url.searchParams.set("variant", variant);
          history.replaceState({}, "", url);
          screen = "manager";
          preview = false;
        } else if (a === "mode") {
          draft.mode = t.dataset.mode;
          saveFailed = false;
        } else if (a === "provider") {
          provider = t.dataset.provider;
        } else if (a === "provider-toggle") {
          providerAction(t.dataset.provider);
        } else if (a === "model") {
          modelAction(decodeModel(t.dataset.model));
        } else if (a === "favorite") {
          const m = decodeModel(t.dataset.model),
            k = key(m);
          draft.favorites = draft.favorites.includes(k)
            ? draft.favorites.filter((v) => v !== k)
            : [...draft.favorites, k];
        } else if (a === "save") {
          save();
        } else if (a === "cancel") {
          draft = structuredClone(saved[instance]);
          saveFailed = false;
          dirtyHint = "";
        } else if (a === "close") {
          closeManager();
        } else if (a === "discard-close") {
          draft = structuredClone(saved[instance]);
          dirtyHint = "";
          closeManager();
        } else if (a === "preview") {
          preview = true;
          screen = "picker";
          pickerSearch = "";
        } else if (a === "manage") {
          openManager();
        } else if (a === "open-picker") {
          screen = "picker";
          preview = false;
          pickerModel = current;
        } else if (a === "close-picker") {
          screen = preview ? "manager" : "workspace";
          preview = false;
        } else if (a === "pick-instance") {
          changeInstance(t.dataset.instance);
          pickerModel = current;
        } else if (a === "choose-model") {
          pickerModel = decodeModel(t.dataset.model);
        } else if (a === "choose-level") {
          if (instance !== workingInstance) {
            notice(
              "Другой профиль создал бы отдельную сессию. В этом прототипе видимости рабочую сессию не меняем.",
            );
          } else {
            current = pickerModel;
            currentLevel = t.dataset.level;
            screen = "workspace";
            preview = false;
            notice("Прототип: выбранная модель/thinking изменены только в примере.");
          }
        } else if (a === "clear-search") {
          search = "";
          view = "all";
        } else if (a === "clear-picker-search") {
          pickerSearch = "";
        } else if (a === "refresh") {
          scenario = "refreshing";
          setTimeout(() => {
            scenario = "ready";
            render();
          }, 650);
        } else if (a === "add-model") {
          const p = provider === "*" ? "openai-codex" : provider;
          const id = `demo-new-${catalog.filter((m) => m.id.startsWith("demo-new")).length + 1}`;
          const m = {
            provider: p,
            id,
            name: "Новая модель · демонстрация обновления",
            levels: ["off", "medium", "high"],
          };
          catalog.push(m);
          notice(
            `Новая модель ${p}/${id}: ${visible(m) ? "видна" : "скрыта"} по правилам черновика.`,
          );
        } else if (a === "hide-all") {
          draft = { ...draft, mode: "only", include: [], exclude: [] };
        } else if (a === "reset") {
          draft = { mode: "all", include: [], exclude: [], favorites: [...draft.favorites] };
        } else if (a === "remove-rule") {
          draft[t.dataset.type].splice(Number(t.dataset.index), 1);
        } else if (a === "add-rule") {
          const select = document.querySelector(`[data-rule-select="${t.dataset.type}"]`);
          addRule(t.dataset.type, JSON.parse(decodeURIComponent(select.value)));
        } else if (a === "state") {
          showState = !showState;
        } else if (a === "scale") {
          const now = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue("--scale"),
          );
          document.documentElement.style.setProperty(
            "--scale",
            now < 1.1 ? "1.2" : now < 1.3 ? "1.4" : "1",
          );
        } else if (a === "send") {
          notice("Прототип: сообщение не отправлено. Ни одного вызова агента.");
        }
        render();
      });
      document.addEventListener("input", (event) => {
        const type = event.target.dataset.input;
        if (type === "prompt") {
          window.promptDraft = event.target.value;
          return;
        }
        if (type === "search") search = event.target.value;
        if (type === "picker-search") pickerSearch = event.target.value;
        if (type) render();
      });
      document.addEventListener("change", (event) => {
        const c = event.target.dataset.change;
        if (c === "instance") changeInstance(event.target.value);
        if (c === "view") view = event.target.value;
        if (c === "provider") provider = event.target.value;
        if (c === "scenario") {
          scenario = event.target.value;
          saveFailed = false;
        }
        if (c) render();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          if (showState) showState = false;
          else if (screen === "manager") closeManager();
          else if (screen === "picker") {
            screen = preview ? "manager" : "workspace";
            preview = false;
          }
          render();
          return;
        }
        if (
          ["ArrowLeft", "ArrowRight"].includes(event.key) &&
          !event.target.closest("input,textarea,select,[contenteditable=true]")
        ) {
          event.preventDefault();
          const direction = event.key === "ArrowRight" ? 1 : -1;
          variant = variants[(variants.indexOf(variant) + direction + 3) % 3];
          const u = new URL(location.href);
          u.searchParams.set("variant", variant);
          history.replaceState({}, "", u);
          screen = "manager";
          render();
        }
      });
      function fullName(event) {
        const el = event.target.closest("[data-fullname]");
        if (el) el.title = el.scrollWidth > el.clientWidth ? el.dataset.fullname : "";
      }
      document.addEventListener("pointerover", fullName);
      document.addEventListener("focusin", fullName);
      render();
    </script>
  </body>
</html>
