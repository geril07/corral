  "@vitest/browser-playwright": 5.0.5
  "@xterm/addon-fit": 0.11.0
  "@xterm/addon-serialize": 0.14.0
  "@xterm/addon-webgl": 0.19.0
  "@xterm/headless": 6.0.0
  "@xterm/xterm": 6.0.0
  oxc-transform-react: 0.156.0
  electron: 45.1.0
  lucide-react: 1.65.0
  fast-check: 4.10.2
  node-pty: 1.1.0
  playwright: 1.64.1
